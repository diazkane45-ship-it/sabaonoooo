<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b7b88">
<title>Acceso Velora</title>
<style>
  :root {
    --teal-osc: #0b7b88;
    --teal: #1597a9;
    --teal-linea: #5bb5c0;
    --teal-pie: #2898a6;
    --gris-txt: #8b9094;
    --gris-btn: #f0f1f1;
    --gris-btn-txt: #9b9d9e;
    --tinta: #1d2b33;
    --alto-cabecera: clamp(56px, 8.7dvh, 69px);
    --fuente: Roboto, "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    overscroll-behavior-y: none; background: #fff;
  }
  body {
    font-family: var(--fuente); color: var(--tinta);
    -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent;
  }
  button, a, input { touch-action: manipulation; }

  /* ---------- pantalla ---------- */
  .app {
    position: fixed; left: 0; right: 0; top: var(--arriba-real, 0px);
    height: 100vh; height: 100dvh; height: var(--alto-real, 100dvh);
    display: flex; flex-direction: column;
    overflow: hidden; background: #fff;
  }

  /* ---------- cabecera ---------- */
  .cabecera {
    flex: none; position: relative; height: var(--alto-cabecera);
    display: flex; align-items: center; justify-content: center;
  }
  .menu {
    flex: none; position: absolute; left: 15px; top: 50%; transform: translateY(-50%);
    width: 44px; height: 44px; padding: 0; border: 0; background: none;
    display: grid; place-items: center; color: #1488a0; cursor: pointer; border-radius: 50%;
  }
  .menu svg { width: 20px; height: 14px; display: block; }
  .logo { flex: none; width: 140px; height: 35px; display: block; }

  /* ---------- zona central (la única que se desplaza) ---------- */
  .contenido {
    flex: 1 1 auto; min-height: 0;
    overflow-y: auto; overscroll-behavior: contain;
    display: flex; flex-direction: column;
  }
  .espacio-arriba { flex: 69 1 0; min-height: 12px; }
  .espacio-abajo  { flex: 100 1 0; min-height: 16px; }

  .form { flex: none; width: 100%; max-width: 560px; margin: 0 auto; }
  .lema {
    margin: 0 18px; text-align: center; color: var(--teal);
    font-size: 14px; line-height: 20px; font-weight: 500;
  }

  .campo {
    position: relative; margin: 0 18px; height: 55px; padding-top: 11px;
    border-bottom: 2px solid var(--teal-linea);
    display: flex; align-items: center;
    transition: border-color .15s;
  }
  .campo:focus-within { border-bottom-color: var(--teal); }
  .campo input {
    flex: 1 1 auto; min-width: 0; height: 42px; padding: 0 4px 0 0;
    border: 0; border-radius: 0; outline: 0; background: transparent;
    font: inherit; font-size: 16px; color: var(--tinta);
    -webkit-appearance: none; appearance: none;
  }
  .campo input::-ms-reveal, .campo input::-ms-clear { display: none; }
  .campo input:-webkit-autofill { -webkit-box-shadow: 0 0 0 40px #fff inset; -webkit-text-fill-color: var(--tinta); }
  .campo label {
    position: absolute; left: 0; top: 11px; height: 42px; line-height: 42px;
    font-size: 16px; color: var(--gris-txt); pointer-events: none; white-space: nowrap;
    transform-origin: left top; transition: transform .15s ease, color .15s;
  }
  .campo input:focus + label,
  .campo input:not(:placeholder-shown) + label,
  .campo input:-webkit-autofill + label {
    transform: translateY(-19px) scale(.75); color: var(--teal);
  }
  .ojo {
    flex: none; width: 44px; height: 44px; margin: -1px 0; padding: 0;
    border: 0; background: none; color: #0d7c8a; cursor: pointer;
    display: grid; place-items: center; border-radius: 50%;
  }
  .ojo svg { width: 26px; height: 26px; display: block; }
  .ojo .abierto { display: none; }
  .ojo[aria-pressed="true"] .abierto { display: block; }
  .ojo[aria-pressed="true"] .cerrado { display: none; }

  .zona-boton { flex: none; margin: 9px 8px 0; }
  .entrar {
    position: relative; width: 100%; height: 50px; padding: 0 44px;
    border: 0; border-radius: 3px; background: var(--gris-btn); color: var(--gris-btn-txt);
    font: inherit; font-size: 17px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    transition: background-color .15s, color .15s;
  }
  .entrar:disabled { cursor: default; }
  .entrar:not(:disabled) { background: var(--teal); color: #fff; }
  .entrar:not(:disabled):active { background: var(--teal-osc); }
  .entrar .flecha { position: absolute; right: 16px; top: 50%; width: 10px; height: 16px; margin-top: -8px; }
  .entrar .flecha path { stroke: #c2c5c6; }
  .entrar:not(:disabled) .flecha path { stroke: #fff; }
  .giro {
    width: 18px; height: 18px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,.4); border-top-color: #fff;
    animation: girar .8s linear infinite; display: none;
  }
  .entrar.cargando .giro { display: block; }
  @keyframes girar { to { transform: rotate(360deg); } }

  /* ---------- pie ---------- */
  .pie {
    flex: none; width: 100%; min-height: 52px; margin: 0; padding: 0 8px 0 10px;
    border: 0; background: var(--teal-pie); color: #fff; cursor: pointer;
    font: inherit; font-size: 14px; text-align: left;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .pie svg { flex: none; width: 12px; height: 22px; margin-right: 6px; }
  .barra-segura { flex: none; height: env(safe-area-inset-bottom, 0px); background: var(--teal-osc); }

  /* ---------- con el teclado abierto ---------- */
  .app.teclado .pie, .app.teclado .barra-segura { display: none; }
  .app.teclado .espacio-arriba { flex: 0 0 16px; }
  .app.teclado .espacio-abajo { flex: 0 0 0; min-height: 0; }
  .app.teclado .zona-boton {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 20;
    margin: 0;
    padding: 10px 8px calc(10px + env(safe-area-inset-bottom));
    background: #fff;
    box-shadow: 0 -2px 10px rgba(20, 30, 60, .12);
  }
  .app.teclado .contenido { padding-bottom: 92px; }

  /* ---------- aviso ---------- */
  .aviso {
    position: absolute; left: 16px; right: 16px; top: calc(var(--alto-cabecera) + 8px); z-index: 30;
    padding: 12px 14px; border-radius: 6px; background: var(--tinta); color: #fff;
    font-size: 14px; line-height: 1.4; box-shadow: 0 4px 14px rgba(0,0,0,.2);
    opacity: 0; transform: translateY(-6px); pointer-events: none;
    transition: opacity .2s, transform .2s;
  }
  .aviso.ver { opacity: 1; transform: none; }

  /* ---------- paneles (menú y ayuda) ---------- */
  dialog { border: 0; padding: 0; margin: 0; max-width: none; max-height: none; color: inherit; font: inherit; background: #fff; }
  dialog::backdrop { background: rgba(10, 30, 40, .45); }
  .panel { display: flex; flex-direction: column; height: 100%; max-height: inherit; }
  .panel-cab {
    flex: none; display: flex; align-items: center; justify-content: space-between;
    min-height: 56px; padding: 0 6px 0 18px; border-bottom: 1px solid #e6eaeb;
    font-weight: 500; font-size: 16px; color: var(--teal-osc);
  }
  .cerrar {
    flex: none; width: 44px; height: 44px; padding: 0; border: 0; background: none;
    color: #5c6870; cursor: pointer; display: grid; place-items: center; border-radius: 50%;
  }
  .cerrar svg { width: 18px; height: 18px; }
  .lista { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; margin: 0; padding: 6px 0; list-style: none; }
  .lista button {
    flex: none; width: 100%; min-height: 48px; padding: 0 18px;
    border: 0; background: none; text-align: left; cursor: pointer;
    font: inherit; font-size: 15px; color: var(--tinta);
  }
  .lista button:active { background: #eef6f7; }
  .cajon {
    position: fixed; inset: 0 auto 0 0;
    width: min(84vw, 320px); height: 100%; height: 100dvh;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .hoja {
    position: fixed; inset: auto 0 0 0; width: 100%;
    max-height: 85vh; max-height: 85dvh;
    border-radius: 12px 12px 0 0;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .cajon[open] { animation: entraIzq .2s ease-out; }
  .hoja[open]  { animation: entraAbajo .2s ease-out; }
  @keyframes entraIzq { from { transform: translateX(-100%); } }
  @keyframes entraAbajo { from { transform: translateY(100%); } }

  :focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
  .campo input:focus-visible { outline: 0; }

  @media (max-height: 560px) {
    .espacio-arriba { min-height: 6px; }
    .espacio-abajo { min-height: 10px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .entrar.cargando .giro { border-color: #fff; }
  }
</style>
</head>

  <main class="contenido" id="contenido">
    <div class="espacio-arriba"></div>

    <form class="form" id="form" autocomplete="on" novalidate>
      <p class="lema">Usa tus claves de Usuario Premium para acceder</p>

      <div class="campo">
        <input id="usuario" name="usuario" type="text" placeholder=" "
               autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false">
        <label for="usuario">Usuario</label>
      </div>

      <div class="campo">
        <input id="clave" name="clave" type="password" placeholder=" "
               autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false">
        <label for="clave">Contraseña</label>
        <button class="ojo" id="ojo" type="button" aria-pressed="false" aria-label="Mostrar contraseña" aria-controls="clave">
          <svg class="cerrado" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="currentColor" d="M12 6.5c3.8 0 7.2 2.2 8.8 5.5-.6 1.3-1.5 2.4-2.6 3.3l1.4 1.4c1.5-1.3 2.7-2.9 3.4-4.7C21.3 7.6 17 4.5 12 4.5c-1.3 0-2.6.2-3.8.6l1.7 1.7c.7-.2 1.4-.3 2.1-.3zm-1.1 1.2 2.1 2.1c.6.3 1 .7 1.3 1.3l2.1 2.1c.1-.4.1-.7.1-1.1 0-2.5-2-4.5-4.5-4.5-.4 0-.7 0-1.1.1zM2.7 3.4 1.3 4.8l2.7 2.7C2.4 8.7 1.1 10.3.3 12c1.7 4.4 6 7.5 11 7.5 1.5 0 3-.3 4.4-.8l3.4 3.4 1.4-1.4L2.7 3.4zm7.5 7.5 2.9 2.9-.1.1c-1.1 0-2-.9-2-2 0-.4.1-.7.2-1zM6.8 7.5l1.8 1.8c-.2.5-.4 1.1-.4 1.7 0 2.5 2 4.5 4.5 4.5.6 0 1.2-.1 1.7-.4l1 1c-.9.2-1.8.4-2.7.4-3.8 0-7.2-2.2-8.8-5.5.7-1.4 1.7-2.6 2.9-3.5z"/>
          </svg>
          <svg class="abierto" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="currentColor" d="M12 4.5C7 4.5 2.7 7.6 1 12c1.7 4.4 6 7.5 11 7.5s9.3-3.1 11-7.5c-1.7-4.4-6-7.5-11-7.5zm0 13c-3.8 0-7.2-2.2-8.8-5.5C4.8 8.7 8.2 6.5 12 6.5s7.2 2.2 8.8 5.5c-1.6 3.3-5 5.5-8.8 5.5zm0-9a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7z"/>

        </button>
      </div>

      <div class="zona-boton">
        <button class="entrar" id="entrar" type="submit" disabled>
          <span class="giro" aria-hidden="true"></span>
          <span id="entrarTxt">Entrar</span>
          <svg class="flecha" viewBox="0 0 10 16" aria-hidden="true"><path d="M2 1.5 8.5 8 2 14.5" fill="none" stroke-width="1.4"/></svg>
        </button>
      </div>
    </form>

    <div class="espacio-abajo"></div>
  </main>

  <button class="pie" id="btnAyuda" type="button" aria-haspopup="dialog">
    <span>¿No puedes entrar? ¿No tienes claves?</span>
    <svg viewBox="0 0 12 22" aria-hidden="true"><path d="M1.5 1.5 10.5 11 1.5 20.5" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <div class="barra-segura"></div>

  <div class="aviso" id="aviso" role="status" aria-live="polite"></div>
</div>

<!-- Menú lateral -->
<dialog class="cajon" id="dlgMenu" aria-label="Menú">
  <div class="panel">
    <div class="panel-cab">
      <span>Menú</span>
      <button class="cerrar" type="button" data-cerrar aria-label="Cerrar menú">
        <svg viewBox="0 0 18 18" aria-hidden="true"><path d="M2 2l14 14M16 2 2 16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <ul class="lista">
      <li><button type="button" data-aviso="Inicio">Inicio</button></li>
      <li><button type="button" data-aviso="Hazte Usuario Premium">Hazte Usuario Premium</button></li>
      <li><button type="button" data-aviso="Ayuda y contacto">Ayuda y contacto</button></li>
      <li><button type="button" data-aviso="Idioma: Español">Idioma: Español</button></li>
      <li><button type="button" data-aviso="Accesibilidad">Accesibilidad</button></li>
    </ul>
  </div>
</dialog>

<!-- Hoja de ayuda -->
<dialog class="hoja" id="dlgAyuda" aria-label="Ayuda para entrar">
  <div class="panel">
    <div class="panel-cab">
      <span>¿Necesitas ayuda?</span>
      <button class="cerrar" type="button" data-cerrar aria-label="Cerrar ayuda">
        <svg viewBox="0 0 18 18" aria-hidden="true"><path d="M2 2l14 14M16 2 2 16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <ul class="lista">
      <li><button type="button" data-aviso="He olvidado mi contraseña">He olvidado mi contraseña</button></li>
      <li><button type="button" data-aviso="Mi usuario está bloqueado">Mi usuario está bloqueado</button></li>
      <li><button type="button" data-aviso="Quiero obtener mis claves">Quiero obtener mis claves</button></li>
    </ul>
  </div>
</dialog>

<script>
(function () {
  'use strict';

  var app = document.getElementById('app');
  var contenido = document.getElementById('contenido');
  var form = document.getElementById('form');
  var usuario = document.getElementById('usuario');
  var clave = document.getElementById('clave');
  var ojo = document.getElementById('ojo');
  var entrar = document.getElementById('entrar');
  var entrarTxt = document.getElementById('entrarTxt');
  var aviso = document.getElementById('aviso');
  var dlgMenu = document.getElementById('dlgMenu');
  var dlgAyuda = document.getElementById('dlgAyuda');
  var campos = [usuario, clave];

  /* ---------- botón Entrar: solo activo con los dos campos rellenos ---------- */
  function actualizarBoton() {
    if (entrar.classList.contains('cargando')) return;
    entrar.disabled = !(usuario.value.trim() && clave.value);
  }
  campos.forEach(function (c) {
    c.addEventListener('input', actualizarBoton);
    c.addEventListener('change', actualizarBoton);
  });
  // el autorrelleno del navegador no siempre lanza 'input'
  setTimeout(actualizarBoton, 300);
  setTimeout(actualizarBoton, 1200);

  /* ---------- mostrar / ocultar contraseña ---------- */
  // evita que el campo pierda el foco (y que se cierre el teclado)
  ojo.addEventListener('mousedown', function (e) { e.preventDefault(); });
  ojo.addEventListener('click', function () {
    var mostrar = clave.type === 'password';
    clave.type = mostrar ? 'text' : 'password';
    ojo.setAttribute('aria-pressed', mostrar ? 'true' : 'false');
    ojo.setAttribute('aria-label', mostrar ? 'Ocultar contraseña' : 'Mostrar contraseña');
  });

  /* ---------- aviso ---------- */
  var tAviso = 0;
  function mostrarAviso(texto) {
    aviso.textContent = texto;
    aviso.classList.add('ver');
    clearTimeout(tAviso);
    tAviso = setTimeout(function () { aviso.classList.remove('ver'); }, 2600);
  }

  /* ---------- envío (demostración: no se manda nada a ningún sitio) ---------- */
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    if (entrar.disabled) return;
    entrar.disabled = true;
    entrar.classList.add('cargando');
    entrarTxt.textContent = 'Entrando…';
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    setTimeout(function () {
      entrar.classList.remove('cargando');
      entrarTxt.textContent = 'Entrar';
      clave.value = '';
      actualizarBoton();
      mostrarAviso('Página de demostración: no se ha enviado ningún dato.');
    }, 1200);
  });

  /* ---------- paneles ---------- */
  function abrir(dlg) {
    if (typeof dlg.showModal === 'function') dlg.showModal();
    else dlg.setAttribute('open', '');
  }
  function cerrar(dlg) {
    if (typeof dlg.close === 'function') dlg.close();
    else dlg.removeAttribute('open');
  }
  document.getElementById('btnMenu').addEventListener('click', function () { abrir(dlgMenu); });
  document.getElementById('btnAyuda').addEventListener('click', function () { abrir(dlgAyuda); });
  [dlgMenu, dlgAyuda].forEach(function (dlg) {
    dlg.addEventListener('click', function (e) {
      if (e.target === dlg) { cerrar(dlg); return; }          // clic en el fondo
      var b = e.target.closest('button');
      if (!b) return;
      if (b.hasAttribute('data-cerrar')) cerrar(dlg);
      else if (b.hasAttribute('data-aviso')) {
        cerrar(dlg);
        mostrarAviso(b.getAttribute('data-aviso') + ' (demostración)');
      }
    });
  });

  /* ---------- teclado (los dos modos: (a) solo visualViewport, (b) toda la ventana) ---------- */
  var altoSinTeclado = 0;

  function altoVisible() {
    return window.visualViewport ? window.visualViewport.height : window.innerHeight;
  }
  function hayCampoEnfocado() {
    return campos.indexOf(document.activeElement) !== -1;
  }
  function asegurarVisible() {
    var el = document.activeElement;
    if (campos.indexOf(el) === -1) return;
    var caja = el.closest('.campo').getBoundingClientRect();
    var zona = contenido.getBoundingClientRect();
    var tapa = app.classList.contains('teclado') ? 92 : 0;   // lo que ocupa el botón anclado
    var limiteAbajo = zona.bottom - tapa - 8;
    var limiteArriba = zona.top + 8;
    if (caja.bottom > limiteAbajo) contenido.scrollTop += caja.bottom - limiteAbajo;
    else if (caja.top < limiteArriba) contenido.scrollTop -= limiteArriba - caja.top;
  }
  function ajustarTeclado() {
    var visible = altoVisible();
    var arriba = window.visualViewport ? window.visualViewport.offsetTop : 0;

    // la referencia solo se actualiza si no hay ningún campo enfocado
    if (!hayCampoEnfocado() && visible > altoSinTeclado) altoSinTeclado = visible;

    app.style.setProperty('--alto-real', visible + 'px');
    // modo (a) en iOS: la ventana se desplaza; la app sigue a la zona visible
    app.style.setProperty('--arriba-real', arriba + 'px');

    // 120px de margen: la barra de direcciones cambia menos; el teclado mucho más
    var abierto = hayCampoEnfocado() && (altoSinTeclado - visible) > 120;
    app.classList.toggle('teclado', abierto);
    if (abierto) requestAnimationFrame(asegurarVisible);
  }

  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', ajustarTeclado);
    window.visualViewport.addEventListener('scroll', ajustarTeclado);
  }
  window.addEventListener('resize', ajustarTeclado);
  window.addEventListener('orientationchange', function () {
    altoSinTeclado = 0;                 // al girar se vuelve a medir
    setTimeout(ajustarTeclado, 400);
  });
  campos.forEach(function (c) {
    c.addEventListener('focus', function () { setTimeout(ajustarTeclado, 50); });
    c.addEventListener('blur', function () { setTimeout(ajustarTeclado, 50); });
  });

  ajustarTeclado();
})();
</script>
